

services:

  # ---------- BANCO POSTGRES ----------
  pncp_postgres:
    image: pgvector/pgvector:pg15
    container_name: pncp_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pncp

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d


  # ---------- API PNCP ----------
  pncp_api:
    build: .
    container_name: pncp_api

    ports:
      - "8000:8000"

    depends_on:
      pncp_postgres:
        condition: service_healthy

    environment:
      POSTGRES_HOST: pncp_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pncp
      RUN_MIGRATIONS: "true"

  
    volumes:
      - .:/app


volumes:
  pgdata: