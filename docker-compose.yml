version: "3.9"

services:
  pncp_postgres:
    image: ankane/pgvector:latest
    container_name: pncp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 5

  pncp_api:
    build: .
    container_name: pncp_api
    depends_on:
      pncp_postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"